<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;
  background:#0F0E0B;
  font-family:'Montserrat',sans-serif;
  display:flex;align-items:center;
  position:relative;
}

/* ── glow ── */
.glow{
  position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(216,90,48,0.22) 0%, transparent 70%);
  top:-160px;right:-100px;
  pointer-events:none;
}
.glow-2{
  position:absolute;
  width:300px;height:300px;
  background:radial-gradient(circle, rgba(216,90,48,0.10) 0%, transparent 70%);
  bottom:-80px;left:40px;
  pointer-events:none;
}

/* ── vertical rule ── */
.rule{
  position:absolute;right:420px;top:0;bottom:0;
  width:1px;background:rgba(255,255,255,0.06);
}

/* ── right panel ── */
.right{
  position:absolute;right:0;top:0;bottom:0;width:400px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:flex-start;
  padding:0 60px;gap:28px;
}
.right-item{
  display:flex;flex-direction:column;gap:6px;
}
.right-dot{
  width:24px;height:2px;background:#D85A30;
}
.right-label{
  font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.35);
}
.right-value{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:400;
  color:rgba(253,251,248,0.75);
  font-style:italic;
}

/* ── main content ── */
.content{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  align-items:flex-start;
  padding:0 80px;
  width:780px;
}
.eyebrow{
  font-size:9px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;
  color:#D85A30;margin-bottom:32px;
  display:flex;align-items:center;gap:12px;
}
.eyebrow::before{content:'';display:block;width:28px;height:1px;background:#D85A30}

.logo{
  display:flex;align-items:baseline;
  margin-bottom:32px;line-height:1;
}
.logo-venu{
  font-family:'Cormorant Garamond',serif;
  font-size:112px;font-weight:300;
  color:#FDFBF8;letter-spacing:-2px;
}
.logo-z{
  display:inline-block;
  margin-left:-8px;
  margin-bottom:-10px;
}

.tagline{
  font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;
  color:rgba(253,251,248,0.45);
  margin-bottom:0;
}
.tagline span{color:rgba(216,90,48,0.7)}

.url{
  position:absolute;bottom:44px;left:80px;
  font-size:9px;letter-spacing:2px;
  color:rgba(255,255,255,0.18);text-transform:uppercase;
}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="rule"></div>

  <div class="content">
    <div class="eyebrow">venuzapp.com</div>
    <div class="logo">
      <span class="logo-venu">Venu</span>
      <span class="logo-z">
        <svg width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="brush" x="-15%" y="-15%" width="130%" height="130%">
              <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="5" result="noise"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
              <feGaussianBlur in="displaced" stdDeviation="0.4"/>
            </filter>
          </defs>
          <g filter="url(#brush)">
            <!-- top bar -->
            <line x1="8" y1="22" x2="112" y2="14" stroke="#D85A30" stroke-width="13" stroke-linecap="round"/>
            <!-- diagonal -->
            <line x1="108" y1="18" x2="16" y2="112" stroke="#D85A30" stroke-width="9" stroke-linecap="round"/>
            <!-- bottom bar with extended swoosh tail -->
            <path d="M10,116 Q60,108 108,102 Q120,100 126,96" stroke="#D85A30" stroke-width="13" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
      </span>
    </div>
    <div class="tagline">Discover<span> · </span>Connect<span> · </span>Experience</div>
  </div>

  <div class="right">
    <div class="right-item">
      <div class="right-dot"></div>
      <div class="right-label">Save</div>
      <div class="right-value">Restaurants, bars, spas,<br>hotels & more</div>
    </div>
    <div class="right-item">
      <div class="right-dot"></div>
      <div class="right-label">Discover</div>
      <div class="right-value">See what friends<br>are saving</div>
    </div>
    <div class="right-item">
      <div class="right-dot"></div>
      <div class="right-label">Go</div>
      <div class="right-value">Every place<br>worth going</div>
    </div>
  </div>

  <div class="url">© 2026 VenuZ</div>
</body>
</html>
