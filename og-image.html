<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;
  background:#0F0E0B;
  font-family:'Montserrat',sans-serif;
  display:flex;align-items:center;
  position:relative;
}

/* ── glow behind logo ── */
.glow{
  position:absolute;
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(216,90,48,0.18) 0%,transparent 65%);
  left:-60px;top:50%;transform:translateY(-50%);
  pointer-events:none;
}

/* ── logo panel ── */
.logo-panel{
  width:520px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:2;
}
.logo-crop{
  width:300px;height:300px;
  border-radius:18%;
  overflow:hidden;
  background:#0F0E0B;
  flex-shrink:0;
}
.logo-crop img{
  width:160%;height:160%;
  margin:-30%;
  display:block;
}

/* ── divider ── */
.divider{
  width:1px;height:360px;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.08),transparent);
  flex-shrink:0;
}

/* ── content panel ── */
.content{
  flex:1;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:0 64px;
  position:relative;z-index:2;
}
.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:3.5px;
  text-transform:uppercase;color:#D85A30;
  margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
}
.eyebrow::before{content:'';width:28px;height:2px;background:#D85A30;display:block}
.headline{
  font-family:'Cormorant Garamond',serif;
  font-size:58px;font-weight:300;line-height:1.1;
  color:#FDFBF8;margin-bottom:24px;
}
.headline em{color:#F0A882;font-style:italic}
.tagline{
  font-size:11px;font-weight:600;letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.55);
  margin-bottom:48px;
}
.tagline span{color:#D85A30;margin:0 8px}

.url{
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.4);
}
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="logo-panel">
    <div class="logo-crop">
      <img src="assets/Venuz App Logo.png" alt="VenuZ"/>
    </div>
  </div>

  <div class="divider"></div>

  <div class="content">
    <div class="eyebrow">Coming Soon</div>
    <div class="headline">Every place<br>worth going,<br><em>saved.</em></div>
    <div class="tagline">Discover<span>·</span>Connect<span>·</span>Experience</div>
    <div class="url">venuzapp.com</div>
  </div>

</body>
</html>
