<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — VenuZ</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --charcoal:#0F0E0B;
  --terracotta:#D85A30;
  --terracotta-light:#F0A882;
  --warm-white:#FDFBF8;
  --muted:#9A9488;
  --border:rgba(255,255,255,0.08);
  --card-bg:rgba(255,255,255,0.03);
}
body{
  font-family:'Montserrat',sans-serif;
  background:var(--charcoal);
  color:var(--warm-white);
  min-height:100vh;
}

/* ── nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,14,11,0.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.nav-logo{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:400;letter-spacing:1px;
  color:var(--warm-white);text-decoration:none;
}
.nav-logo span{color:var(--terracotta)}
.nav-back{
  font-size:9px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
  text-decoration:none;transition:color 0.2s;
}
.nav-back:hover{color:var(--warm-white)}

/* ── main ── */
main{
  max-width:560px;margin:0 auto;
  padding:88px 24px 80px;
}

/* ── avatar ── */
.avatar-wrap{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-bottom:40px;
}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:rgba(216,90,48,0.15);
  border:1px solid rgba(216,90,48,0.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:300;color:var(--terracotta-light);
  margin-bottom:16px;
}
.profile-email{
  font-size:12px;color:var(--muted);margin-bottom:8px;
}
.profile-since{
  font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:0.3px;
}
.beta-pill{
  display:inline-block;margin-top:12px;
  font-size:8px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--terracotta);
  border:1px solid rgba(216,90,48,0.4);
  padding:4px 12px;border-radius:999px;
}

/* ── stats ── */
.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:40px;
}
.stat-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px 16px;
  text-align:center;
}
.stat-num{
  font-family:'Cormorant Garamond',serif;
  font-size:36px;font-weight:300;
  color:var(--warm-white);line-height:1;margin-bottom:6px;
}
.stat-label{
  font-size:8px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
}

/* ── section ── */
.section{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:16px;
}
.section-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
}
.section-row:last-child{border-bottom:none}
.row-label{font-size:11px;color:var(--muted)}
.row-value{font-size:11px;color:var(--warm-white)}

/* ── signout ── */
.signout-btn{
  width:100%;padding:14px;
  background:none;border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  color:rgba(255,255,255,0.3);
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;
  transition:all 0.2s;
}
.signout-btn:hover{
  border-color:rgba(216,90,48,0.4);
  color:var(--terracotta);
}

@media(max-width:600px){
  nav{padding:0 20px}
  main{padding:80px 16px 60px}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-num{font-size:28px}
}
</style>
</head>
<body>

<nav>
  <a href="dashboard.html" class="nav-logo">V<span>e</span>nuZ</a>
  <a href="dashboard.html" class="nav-back">← Wishlist</a>
</nav>

<main>

  <div class="avatar-wrap">
    <div class="avatar" id="avatar-initial">—</div>
    <div class="profile-email" id="profile-email"></div>
    <div class="profile-since" id="profile-since"></div>
    <div class="beta-pill" id="beta-pill" style="display:none">Beta</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="stat-saved">—</div>
      <div class="stat-label">Saved</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-wishlist">—</div>
      <div class="stat-label">Wishlist</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-visited">—</div>
      <div class="stat-label">Visited</div>
    </div>
  </div>

  <div class="section" id="account-section">
    <div class="section-row">
      <span class="row-label">Email</span>
      <span class="row-value" id="account-email"></span>
    </div>
    <div class="section-row">
      <span class="row-label">Member since</span>
      <span class="row-value" id="account-since"></span>
    </div>
    <div class="section-row" id="account-role-row" style="display:none">
      <span class="row-label">Access</span>
      <span class="row-value" style="color:var(--terracotta-light)">Beta</span>
    </div>
  </div>

  <button class="signout-btn" onclick="signOut()">Sign Out</button>

</main>

<script>
const { createClient } = supabase;
const _supabase = createClient(
  'https://xjkrplonwfexigkudhmo.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa3JwbG9ud2ZleGlna3VkaG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTM0NDgsImV4cCI6MjA5NDE4OTQ0OH0.31xr-_HMj5xU3lYvubZMxaKAskJ6g0AUM8w4tYPoI6A'
);

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}
function deleteCookie(name) {
  document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;SameSite=Lax`;
}

async function init() {
  // Restore session from cookies if needed (PWA handoff)
  const at = getCookie('venuz_at');
  const rt = getCookie('venuz_rt');
  if (at && rt) {
    await _supabase.auth.setSession({ access_token: at, refresh_token: rt });
    deleteCookie('venuz_at');
    deleteCookie('venuz_rt');
  }

  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const user = session.user;
  const email = user.email || '';
  const initial = email.charAt(0).toUpperCase();
  const createdAt = new Date(user.created_at);
  const sinceStr = createdAt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  document.getElementById('avatar-initial').textContent = initial;
  document.getElementById('profile-email').textContent = email;
  document.getElementById('profile-since').textContent = `Member since ${sinceStr}`;
  document.getElementById('account-email').textContent = email;
  document.getElementById('account-since').textContent = sinceStr;

  // Load role
  const { data: profile } = await _supabase
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .single();

  if (profile?.role === 'beta') {
    document.getElementById('beta-pill').style.display = 'inline-block';
    document.getElementById('account-role-row').style.display = 'flex';
  }

  // Load place stats
  const { data: places } = await _supabase
    .from('places')
    .select('status')
    .eq('user_id', user.id);

  if (places) {
    const total   = places.length;
    const visited = places.filter(p => p.status === 'visited').length;
    const wishlist = places.filter(p => (p.status || 'want_to_go') === 'want_to_go').length;
    document.getElementById('stat-saved').textContent    = total;
    document.getElementById('stat-wishlist').textContent = wishlist;
    document.getElementById('stat-visited').textContent  = visited;
  }
}

async function signOut() {
  await _supabase.auth.signOut();
  window.location.href = '../index.html';
}

init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
