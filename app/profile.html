<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — VenuZ</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --charcoal:#0F0E0B;
  --terracotta:#D85A30;
  --terracotta-light:#F0A882;
  --warm-white:#FDFBF8;
  --muted:#9A9488;
  --border:rgba(255,255,255,0.08);
  --card-bg:rgba(255,255,255,0.03);
}
body{font-family:'Montserrat',sans-serif;background:var(--charcoal);color:var(--warm-white);min-height:100vh}

/* ── nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,14,11,0.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:1px;color:var(--warm-white);text-decoration:none}
.nav-logo span{color:var(--terracotta)}
.nav-back{
  font-size:9px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
  text-decoration:none;
  transition:color 0.2s;
}
.nav-back:hover{color:var(--warm-white)}

/* ── main ── */
main{max-width:560px;margin:0 auto;padding:88px 24px 80px}

.page-title{
  font-family:'Cormorant Garamond',serif;
  font-size:42px;font-weight:300;line-height:1;
  margin-bottom:36px;
}

/* ── profile card ── */
.profile-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:32px;
  display:flex;align-items:center;gap:24px;
  margin-bottom:20px;
}
.avatar{
  width:60px;height:60px;border-radius:50%;
  background:rgba(216,90,48,0.15);
  border:1px solid rgba(216,90,48,0.3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:26px;font-weight:400;
  color:var(--terracotta-light);
  flex-shrink:0;
}
.profile-details{flex:1;min-width:0}
.profile-email{
  font-size:13px;font-weight:500;
  margin-bottom:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.profile-since{font-size:10px;color:var(--muted);letter-spacing:0.3px}
.beta-pill{
  display:none;
  margin-top:10px;
  font-size:8px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--terracotta);
  border:1px solid rgba(216,90,48,0.4);
  padding:4px 10px;border-radius:999px;
  width:fit-content;
}

/* ── stats ── */
.stats-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:32px;
}
.stat-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px 16px;
  text-align:center;
}
.stat-value{
  font-family:'Cormorant Garamond',serif;
  font-size:40px;font-weight:300;line-height:1;
  margin-bottom:8px;
  color:var(--warm-white);
}
.stat-label{
  font-size:9px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
}

/* ── actions ── */
.section-title{
  font-size:9px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;
}
.action-row{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
}
.action-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  text-decoration:none;
  transition:background 0.15s;
}
.action-item:last-child{border-bottom:none}
.action-item:hover{background:rgba(255,255,255,0.03)}
.action-label{font-size:12px;color:var(--warm-white)}
.action-chevron{font-size:12px;color:var(--muted)}

.signout-btn{
  width:100%;padding:14px;
  background:none;
  border:1px solid rgba(216,90,48,0.25);
  border-radius:10px;
  color:var(--terracotta-light);
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;
  transition:all 0.2s;
  margin-top:20px;
}
.signout-btn:hover{background:rgba(216,90,48,0.08);border-color:rgba(216,90,48,0.4)}

@media(max-width:600px){
  nav{padding:0 20px}
  main{padding:80px 16px 60px}
  .profile-card{padding:24px 20px;gap:16px}
  .stats-grid{gap:8px}
  .stat-card{padding:20px 12px}
  .stat-value{font-size:32px}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">V<span>e</span>nuZ</a>
  <a href="dashboard.html" class="nav-back">← Dashboard</a>
</nav>

<main>
  <div class="page-title">Profile</div>

  <div class="profile-card">
    <div class="avatar" id="avatar">?</div>
    <div class="profile-details">
      <div class="profile-email" id="profile-email">—</div>
      <div class="profile-since" id="profile-since">Loading…</div>
      <div class="beta-pill" id="beta-pill">Beta User</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Saved</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-visited">—</div>
      <div class="stat-label">Visited</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-wishlist">—</div>
      <div class="stat-label">Wishlist</div>
    </div>
  </div>

  <div class="section-title">Account</div>
  <div class="action-row">
    <a href="dashboard.html" class="action-item">
      <span class="action-label">My Wishlist</span>
      <span class="action-chevron">›</span>
    </a>
  </div>

  <button class="signout-btn" onclick="signOut()">Sign Out</button>
</main>

<script>
const { createClient } = supabase;
const _supabase = createClient(
  'https://xjkrplonwfexigkudhmo.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa3JwbG9ud2ZleGlna3VkaG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTM0NDgsImV4cCI6MjA5NDE4OTQ0OH0.31xr-_HMj5xU3lYvubZMxaKAskJ6g0AUM8w4tYPoI6A'
);

async function init() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  const user = session.user;
  const email = user.email || '';
  const initial = email.charAt(0).toUpperCase();
  const createdAt = new Date(user.created_at);
  const since = createdAt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  document.getElementById('avatar').textContent = initial;
  document.getElementById('profile-email').textContent = email;
  document.getElementById('profile-since').textContent = 'Member since ' + since;

  // Check role
  const { data: profile } = await _supabase
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .single();

  if (profile?.role === 'beta') {
    document.getElementById('beta-pill').style.display = 'block';
  }

  // Load stats
  const { data: places } = await _supabase
    .from('places')
    .select('visited')
    .eq('user_id', user.id);

  const total = places?.length || 0;
  const visited = places?.filter(p => p.visited).length || 0;
  const wishlist = total - visited;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-visited').textContent = visited;
  document.getElementById('stat-wishlist').textContent = wishlist;
}

async function signOut() {
  await _supabase.auth.signOut();
  window.location.href = '../index.html';
}

init();
</script>
</body>
</html>
