<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenuZ</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --charcoal:#0F0E0B;
  --terracotta:#D85A30;
  --warm-white:#FDFBF8;
  --muted:#9A9488;
}
body{
  font-family:'Montserrat',sans-serif;
  background:var(--charcoal);
  color:var(--warm-white);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
}
.glow{
  position:fixed;width:500px;height:500px;
  background:radial-gradient(circle,rgba(216,90,48,0.12) 0%,transparent 70%);
  top:-150px;right:-150px;pointer-events:none;
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;font-weight:400;letter-spacing:1px;
}
.logo span{color:var(--terracotta)}
.status{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.spinner{
  width:20px;height:20px;
  border:2px solid rgba(255,255,255,0.1);
  border-top-color:var(--terracotta);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="glow"></div>
<div class="logo">V<span>e</span>nuZ</div>
<div class="spinner"></div>
<div class="status" id="status">Signing you in…</div>

<script>
const { createClient } = supabase;
const _supabase = createClient(
  'https://xjkrplonwfexigkudhmo.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa3JwbG9ud2ZleGlna3VkaG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTM0NDgsImV4cCI6MjA5NDE4OTQ0OH0.31xr-_HMj5xU3lYvubZMxaKAskJ6g0AUM8w4tYPoI6A'
);

async function handleCallback() {
  // PKCE flow: supabase sends ?code=... to this URL
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    const { data, error } = await _supabase.auth.exchangeCodeForSession(code);
    if (data?.session) {
      window.location.replace('./dashboard.html');
      return;
    }
    if (error) {
      document.getElementById('status').textContent = 'Link expired or already used.';
      setTimeout(() => window.location.replace('./login.html'), 2500);
      return;
    }
  }

  // Implicit/hash flow fallback
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    window.location.replace('./dashboard.html');
    return;
  }

  document.getElementById('status').textContent = 'No session found. Redirecting…';
  setTimeout(() => window.location.replace('./login.html'), 2000);
}

handleCallback();
</script>
</body>
</html>
