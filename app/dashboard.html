<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — VenuZ</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --charcoal:#0F0E0B;
  --terracotta:#D85A30;
  --terracotta-light:#F0A882;
  --warm-white:#FDFBF8;
  --muted:#9A9488;
  --border:rgba(255,255,255,0.08);
  --card-bg:rgba(255,255,255,0.03);
  --green:rgba(75,165,90,1);
  --green-bg:rgba(75,165,90,0.1);
  --green-border:rgba(75,165,90,0.3);
}
body{font-family:'Montserrat',sans-serif;background:var(--charcoal);color:var(--warm-white);min-height:100vh}

/* ── nav ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:0 32px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,14,11,0.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;letter-spacing:1px;color:var(--warm-white);text-decoration:none}
.nav-logo span{color:var(--terracotta)}
.nav-right{display:flex;align-items:center;gap:16px}
.beta-badge{
  font-size:8px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--terracotta);
  border:1px solid rgba(216,90,48,0.4);
  padding:4px 10px;border-radius:999px;display:none;
}
.nav-profile{
  font-size:10px;color:var(--muted);text-decoration:none;
  transition:color 0.2s;
}
.nav-profile:hover{color:var(--warm-white)}
.nav-signout{
  font-size:9px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
  background:none;border:none;cursor:pointer;
  transition:color 0.2s;padding:0;
}
.nav-signout:hover{color:var(--warm-white)}

/* ── main ── */
main{max-width:720px;margin:0 auto;padding:88px 24px 80px}

/* ── page header ── */
.page-header{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:28px;flex-wrap:wrap;gap:16px;
}
.page-title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;line-height:1}
.add-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 20px;
  background:var(--terracotta);border:none;
  border-radius:999px;color:#fff;
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;
  transition:background 0.2s;
}
.add-btn:hover{background:#C04E28}

/* ── filters ── */
.filter-section{margin-bottom:28px;display:flex;flex-direction:column;gap:10px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-row-label{
  font-size:8px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:rgba(255,255,255,0.2);
  align-self:center;white-space:nowrap;
}
.filter-btn{
  font-size:9px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;padding:6px 14px;
  border-radius:999px;border:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer;
  transition:all 0.2s;
}
.filter-btn:hover{border-color:rgba(216,90,48,0.5);color:var(--terracotta);background:rgba(216,90,48,0.06)}
.filter-btn.active{border-color:rgba(216,90,48,0.5);color:var(--terracotta);background:rgba(216,90,48,0.08)}
.filter-btn.visited-active{border-color:var(--green-border);color:#7dd87f;background:var(--green-bg)}
.filter-btn.visited-active:hover{border-color:rgba(75,165,90,0.5);color:#7dd87f}

/* ── empty state ── */
.empty{text-align:center;padding:80px 24px}
.empty-icon{font-size:40px;margin-bottom:20px;opacity:0.4}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;margin-bottom:10px;color:rgba(255,255,255,0.5)}
.empty-sub{font-size:11px;color:var(--muted);line-height:1.8}

/* ── place cards ── */
.places-grid{display:flex;flex-direction:column;gap:10px}
.place-card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;
  transition:border-color 0.2s;
}
.place-card:hover{border-color:rgba(255,255,255,0.13)}
.place-card.visited{border-color:var(--green-border)}
.place-info{flex:1;min-width:0}
.place-name{font-size:14px;font-weight:500;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.place-category{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--terracotta)}
.place-city{font-size:10px;color:var(--muted)}
.visited-badge{
  font-size:8px;font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;color:#7dd87f;
  border:1px solid var(--green-border);
  padding:2px 8px;border-radius:999px;
}
.place-note{font-size:10px;color:rgba(255,255,255,0.4);margin-top:8px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place-url{
  display:inline-block;margin-top:8px;
  font-size:10px;color:var(--terracotta-light);
  text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:100%;
}
.place-url:hover{color:var(--terracotta)}
.place-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.place-tag{
  font-size:9px;letter-spacing:0.5px;
  padding:3px 10px;border-radius:999px;
  background:rgba(216,90,48,0.08);
  border:1px solid rgba(216,90,48,0.18);
  color:var(--terracotta-light);
}

/* ── card actions ── */
.place-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;padding-top:2px}
.action-btn{
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--border);
  background:none;cursor:pointer;
  font-size:13px;
  transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.25);
}
.action-btn:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7)}
.visited-btn.active{border-color:var(--green-border);color:#7dd87f;background:var(--green-bg)}
.visited-btn.active:hover{background:rgba(75,165,90,0.15)}
.delete-btn:hover{border-color:rgba(216,90,48,0.4);color:var(--terracotta-light)}

/* ── modal ── */
.overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:24px;
}
.overlay.open{display:flex}
.modal{
  background:#1a1916;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:36px;
  width:100%;max-width:460px;
  max-height:90vh;overflow-y:auto;
}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{
  display:block;font-size:9px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;outline:none;
  color:var(--warm-white);
  font-family:'Montserrat',sans-serif;
  font-size:12px;transition:border-color 0.2s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(216,90,48,0.5)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,0.2)}
.field select option{background:#1a1916}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field-hint{font-size:9px;color:var(--muted);letter-spacing:0.3px;margin-top:6px}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.modal-cancel{
  flex:1;padding:12px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.1);
  background:none;color:var(--muted);
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;
  transition:all 0.2s;
}
.modal-cancel:hover{border-color:rgba(255,255,255,0.3);color:var(--warm-white)}
.modal-save{
  flex:2;padding:12px;border-radius:8px;
  background:var(--terracotta);border:none;color:#fff;
  font-family:'Montserrat',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;
  transition:background 0.2s;
}
.modal-save:hover{background:#C04E28}
.modal-save:disabled{background:rgba(216,90,48,0.4);cursor:not-allowed}

/* ── beta banner ── */
.beta-banner{
  display:none;
  background:rgba(216,90,48,0.06);
  border:1px solid rgba(216,90,48,0.18);
  border-radius:10px;padding:14px 20px;
  margin-bottom:28px;
  flex-direction:column;gap:6px;
}
.beta-banner-text{font-size:11px;color:rgba(255,255,255,0.55);line-height:1.6}
.beta-banner-text strong{color:var(--terracotta-light)}

@media(max-width:600px){
  nav{padding:0 20px}
  main{padding:80px 16px 60px}
  .modal{padding:28px 20px}
  .page-title{font-size:34px}
  .nav-profile{display:none}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">V<span>e</span>nuZ</a>
  <div class="nav-right">
    <span class="beta-badge" id="beta-badge">Beta</span>
    <a href="profile.html" class="nav-profile" id="nav-profile">—</a>
    <button class="nav-signout" onclick="signOut()">Sign out</button>
  </div>
</nav>

<main>

  <div class="beta-banner" id="beta-banner">
    <div class="beta-banner-text">
      <strong>You're a beta user.</strong> More features coming soon — Google Maps import, share from Instagram &amp; TikTok, and Friends Feed.
    </div>
  </div>

  <div class="page-header">
    <h1 class="page-title">My Wishlist</h1>
    <button class="add-btn" onclick="openModal()">+ Save a Place</button>
  </div>

  <!-- Status filters -->
  <div class="filter-section">
    <div class="filter-row" id="status-filters">
      <button class="filter-btn active" data-status="all" onclick="setStatus('all', this)">All</button>
      <button class="filter-btn" data-status="wishlist" onclick="setStatus('wishlist', this)">Wishlist</button>
      <button class="filter-btn" data-status="visited" onclick="setStatus('visited', this)">Visited</button>
    </div>
    <!-- Category filters -->
    <div class="filter-row" id="category-filters">
      <button class="filter-btn active" data-cat="all" onclick="setCategory('all', this)">All Types</button>
      <button class="filter-btn" data-cat="Restaurant" onclick="setCategory('Restaurant', this)">Restaurants</button>
      <button class="filter-btn" data-cat="Bar" onclick="setCategory('Bar', this)">Bars</button>
      <button class="filter-btn" data-cat="Spa" onclick="setCategory('Spa', this)">Spas</button>
      <button class="filter-btn" data-cat="Hotel" onclick="setCategory('Hotel', this)">Hotels</button>
      <button class="filter-btn" data-cat="Beach" onclick="setCategory('Beach', this)">Beaches</button>
      <button class="filter-btn" data-cat="Market" onclick="setCategory('Market', this)">Markets</button>
      <button class="filter-btn" data-cat="Lounge" onclick="setCategory('Lounge', this)">Lounges</button>
      <button class="filter-btn" data-cat="Other" onclick="setCategory('Other', this)">Other</button>
    </div>
  </div>

  <div id="places-container"></div>

</main>

<!-- Add / Edit Modal -->
<div class="overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Save a Place</div>
    <div class="field">
      <label>Place Name *</label>
      <input type="text" id="place-name" placeholder="e.g. Carbone, Nobu, The Standard" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Category *</label>
      <select id="place-category">
        <option value="">Select a category</option>
        <option>Restaurant</option>
        <option>Bar</option>
        <option>Spa</option>
        <option>Hotel</option>
        <option>Beach</option>
        <option>Market</option>
        <option>Lounge</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>City</label>
      <input type="text" id="place-city" placeholder="e.g. New York, Accra" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Link <span style="color:rgba(255,255,255,0.2);font-weight:400">(optional)</span></label>
      <input type="url" id="place-url" placeholder="Google Maps, Instagram, TikTok…" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Note <span style="color:rgba(255,255,255,0.2);font-weight:400">(optional)</span></label>
      <textarea id="place-note" placeholder="Why do you want to go? Any details worth remembering…"></textarea>
    </div>
    <div class="field">
      <label>Tags <span style="color:rgba(255,255,255,0.2);font-weight:400">(optional)</span></label>
      <input type="text" id="place-tags" placeholder="e.g. rooftop, romantic, cocktails" autocomplete="off"/>
      <div class="field-hint">Separate tags with commas.</div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" id="save-btn" onclick="savePlace()">Save Place</button>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const _supabase = createClient(
  'https://xjkrplonwfexigkudhmo.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqa3JwbG9ud2ZleGlna3VkaG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTM0NDgsImV4cCI6MjA5NDE4OTQ0OH0.31xr-_HMj5xU3lYvubZMxaKAskJ6g0AUM8w4tYPoI6A'
);

let currentUser = null;
let allPlaces = [];
let statusFilter = 'all';
let categoryFilter = 'all';
let editingId = null;

// ── Auth guard ──
async function init() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }

  currentUser = session.user;
  const email = currentUser.email || '';
  document.getElementById('nav-profile').textContent = email;

  const { data: profile } = await _supabase
    .from('profiles')
    .select('role')
    .eq('id', currentUser.id)
    .single();

  if (profile?.role === 'beta') {
    document.getElementById('beta-badge').style.display = 'block';
    document.getElementById('beta-banner').style.display = 'flex';
  }

  await loadPlaces();
}

// ── Places ──
async function loadPlaces() {
  const { data, error } = await _supabase
    .from('places')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error) { console.error(error); return; }
  allPlaces = data || [];
  renderPlaces();
}

function renderPlaces() {
  let filtered = allPlaces;
  if (statusFilter === 'wishlist') filtered = filtered.filter(p => !p.visited);
  if (statusFilter === 'visited')  filtered = filtered.filter(p => !!p.visited);
  if (categoryFilter !== 'all')    filtered = filtered.filter(p => p.category === categoryFilter);

  const container = document.getElementById('places-container');

  if (filtered.length === 0) {
    const { title, sub } = emptyMessage();
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📍</div>
        <div class="empty-title">${title}</div>
        <p class="empty-sub">${sub}</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="places-grid">${filtered.map(placeCard).join('')}</div>`;
}

function emptyMessage() {
  if (statusFilter === 'visited')
    return { title: 'No visited places yet', sub: 'Tick the ✓ on any saved place to mark it as visited.' };
  if (statusFilter === 'wishlist' && categoryFilter === 'all')
    return { title: 'Wishlist is empty', sub: 'Hit "Save a Place" to start building your wishlist.' };
  if (statusFilter === 'all' && categoryFilter === 'all')
    return { title: 'Nothing saved yet', sub: 'Hit "Save a Place" to start building your wishlist.' };
  return { title: `No ${categoryFilter.toLowerCase()}s found`, sub: 'Try adjusting your filters.' };
}

function parseTags(tags) {
  if (!tags) return [];
  if (Array.isArray(tags)) return tags.filter(Boolean);
  return String(tags).split(',').map(t => t.trim()).filter(Boolean);
}

function safeUrl(url) {
  if (!url) return '';
  const t = url.trim();
  return /^https?:\/\//i.test(t) ? t : 'https://' + t;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function placeCard(p) {
  const visited = !!p.visited;
  const tags = parseTags(p.tags);
  const url = p.url || '';
  const displayUrl = url.replace(/^https?:\/\//i, '').substring(0, 45);

  return `
    <div class="place-card${visited ? ' visited' : ''}">
      <div class="place-info">
        <div class="place-name">${escHtml(p.name)}</div>
        <div class="place-meta">
          ${p.category ? `<span class="place-category">${escHtml(p.category)}</span>` : ''}
          ${p.city ? `<span class="place-city">📍 ${escHtml(p.city)}</span>` : ''}
          ${visited ? '<span class="visited-badge">Visited</span>' : ''}
        </div>
        ${p.note ? `<div class="place-note">${escHtml(p.note)}</div>` : ''}
        ${url ? `<a class="place-url" href="${escHtml(safeUrl(url))}" target="_blank" rel="noopener noreferrer">🔗 ${escHtml(displayUrl)}</a>` : ''}
        ${tags.length ? `<div class="place-tags">${tags.map(t => `<span class="place-tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="place-actions">
        <button class="action-btn visited-btn${visited ? ' active' : ''}" onclick="toggleVisited('${p.id}', ${!visited})" title="${visited ? 'Move to wishlist' : 'Mark as visited'}">✓</button>
        <button class="action-btn edit-btn" onclick="openEditModal('${p.id}')" title="Edit">✎</button>
        <button class="action-btn delete-btn" onclick="deletePlace('${p.id}')" title="Remove">✕</button>
      </div>
    </div>`;
}

// ── Filters ──
function setStatus(status, btn) {
  statusFilter = status;
  document.querySelectorAll('#status-filters .filter-btn').forEach(b => {
    b.classList.remove('active', 'visited-active');
  });
  if (status === 'visited') btn.classList.add('visited-active');
  else btn.classList.add('active');
  renderPlaces();
}

function setCategory(cat, btn) {
  categoryFilter = cat;
  document.querySelectorAll('#category-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPlaces();
}

// ── Modal ──
function openModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Save a Place';
  document.getElementById('save-btn').textContent = 'Save Place';
  clearModalFields();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('place-name').focus();
}

function openEditModal(id) {
  const p = allPlaces.find(p => p.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Place';
  document.getElementById('save-btn').textContent = 'Save Changes';
  document.getElementById('place-name').value = p.name || '';
  document.getElementById('place-category').value = p.category || '';
  document.getElementById('place-city').value = p.city || '';
  document.getElementById('place-url').value = p.url || '';
  document.getElementById('place-note').value = p.note || '';
  document.getElementById('place-tags').value = parseTags(p.tags).join(', ');
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('place-name').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
  clearModalFields();
  const btn = document.getElementById('save-btn');
  btn.disabled = false;
  btn.textContent = 'Save Place';
}

function clearModalFields() {
  ['place-name','place-city','place-url','place-note','place-tags'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('place-category').value = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function collectFields() {
  const name = document.getElementById('place-name').value.trim();
  const category = document.getElementById('place-category').value;
  const city = document.getElementById('place-city').value.trim();
  const url = document.getElementById('place-url').value.trim();
  const note = document.getElementById('place-note').value.trim();
  const tagsRaw = document.getElementById('place-tags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
  return { name, category, city, url, note, tags };
}

async function savePlace() {
  const { name, category, city, url, note, tags } = collectFields();
  const btn = document.getElementById('save-btn');

  if (!name) { document.getElementById('place-name').focus(); return; }
  if (!category) { document.getElementById('place-category').focus(); return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  if (editingId) {
    await updatePlace(editingId, { name, category, city, url, note, tags });
  } else {
    await insertPlace({ name, category, city, url, note, tags });
  }
}

async function insertPlace(fields) {
  const btn = document.getElementById('save-btn');
  const record = { user_id: currentUser.id, ...buildRecord(fields) };
  const { error } = await _supabase.from('places').insert([record]);
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Save Place';
    alert('Something went wrong. Please try again.');
    return;
  }
  closeModal();
  await loadPlaces();
}

async function updatePlace(id, fields) {
  const btn = document.getElementById('save-btn');
  const record = buildRecord(fields);
  const { error } = await _supabase.from('places').update(record).eq('id', id).eq('user_id', currentUser.id);
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    alert('Something went wrong. Please try again.');
    return;
  }
  closeModal();
  await loadPlaces();
}

function buildRecord({ name, category, city, url, note, tags }) {
  const r = { name, category };
  if (city)  r.city = city;
  if (url)   r.url = url;
  if (note)  r.note = note;
  r.tags = tags.length ? tags : null;
  return r;
}

// ── Visited toggle ──
async function toggleVisited(id, newState) {
  const update = { visited: newState };
  if (newState) update.visited_at = new Date().toISOString();
  const { error } = await _supabase.from('places').update(update).eq('id', id).eq('user_id', currentUser.id);
  if (!error) {
    const p = allPlaces.find(p => p.id === id);
    if (p) { p.visited = newState; if (newState) p.visited_at = update.visited_at; }
    renderPlaces();
  }
}

// ── Delete ──
async function deletePlace(id) {
  const { error } = await _supabase.from('places').delete().eq('id', id).eq('user_id', currentUser.id);
  if (!error) {
    allPlaces = allPlaces.filter(p => p.id !== id);
    renderPlaces();
  }
}

// ── Sign out ──
async function signOut() {
  await _supabase.auth.signOut();
  window.location.href = '../index.html';
}

init();
</script>
